<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081528"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primary" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="28" y1="18" x2="52" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern App Squircle Backdrop -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bg)"/>
  <rect x="3" y="3" width="58" height="58" rx="14" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle grid lines in background for technical engineering feel -->
  <path d="M18 3v58M46 3v58M3 18h58M3 46h58" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Stylized Field Service "F" Emblem -->
  <!-- Vertical Spine / Column -->
  <path d="M19 16C19 14.8954 19.8954 14 21 14H27C28.1046 14 29 14.8954 29 16V48C29 49.1046 28.1046 50 27 50H21C19.8954 50 19 49.1046 19 48V16Z" fill="url(#primary)"/>

  <!-- Top Arm (Precision Speed / Arrowhead Wing) -->
  <path d="M29 14H46C47.3807 14 48.3375 15.3524 47.907 16.6439L45.2403 24.6439C44.978 25.4309 44.2374 25.973 43.4072 25.973H29V14Z" fill="url(#accent)"/>

  <!-- Middle Arm (Service Tool / Technical Prong) -->
  <path d="M29 29H39.5C40.7107 29 41.609 30.147 41.3195 31.3255L40.1695 36.0025C39.9576 36.8641 39.183 37.473 38.294 37.473H29V29Z" fill="url(#primary)"/>

  <!-- Live Dispatch GPS Radar Beacon -->
  <circle cx="48" cy="18" r="3.5" fill="#10b981" filter="url(#glow)"/>
  <circle cx="48" cy="18" r="1.5" fill="#ffffff"/>
  
  <!-- Subtle Route / Wrench Node in Lower Corner -->
  <circle cx="43" cy="45" r="3" fill="#06b6d4" fill-opacity="0.9"/>
  <path d="M29 45H40" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3"/>
</svg>
